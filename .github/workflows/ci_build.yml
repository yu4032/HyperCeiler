name: CI Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - ".idea/**"
      - "doc/**"
      - "*.md"
      - "imgs/**"
      - "app/src/assets/**"
      - "crowdin.yml"
  push:
    branches: [main, browser-custom-search-engine]
    paths-ignore:
      - ".idea/**"
      - "doc/**"
      - "*.md"
      - "imgs/**"
      - "app/src/assets/**"
      - "crowdin.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build_app:
    runs-on: macos-latest
    name: Build App
    env:
      GIT_ACTOR: ${{ github.actor }}
      GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ALIAS }}

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-overwrite-existing: true

      - name: Configure Release Signing
        if: env.SIGNING_KEY != '' && env.KEY_STORE_PASSWORD != '' && env.KEY_ALIAS != ''
        shell: bash
        run: |
          cat > signing.properties <<EOF
          storePassword=${KEY_STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_STORE_PASSWORD}
          storeFile=../key.jks
          EOF
          printf '%s' "${SIGNING_KEY}" | base64 --decode > key.jks

      - name: Build Canary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          ./gradlew assembleCanary
          echo "APK_DIR=app/build/outputs/apk/canary" >> "$GITHUB_ENV"
          echo "BUILD_VARIANT=Canary" >> "$GITHUB_ENV"

      - name: Build Debug
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          ./gradlew assembleDebug
          echo "APK_DIR=app/build/outputs/apk/debug" >> "$GITHUB_ENV"
          echo "BUILD_VARIANT=Debug" >> "$GITHUB_ENV"

      - name: Find APK
        shell: bash
        run: |
          APK_FILE="$(find "$APK_DIR" -type f -name '*.apk' | head -n 1)"
          test -n "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "APK_FILE_NAME=$(basename "$APK_FILE" .apk)" >> "$GITHUB_ENV"

      - name: Show APK SHA256
        shell: bash
        run: |
          APK_SHA256="$(shasum -a 256 "$APK_FILE" | awk '{print $1}')"
          echo "### Build Success" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variant | SHA256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| $BUILD_VARIANT | $APK_SHA256 |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          compression-level: 9
